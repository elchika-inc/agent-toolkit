<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>レイアウト検査: redraw-large</title>
<style>body { margin: 0; } </style>
<body><main><div>元の要素1</div><div>元の要素2</div><div>元の要素3</div></main>
