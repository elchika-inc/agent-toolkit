<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>レイアウト検査: roots</title>
<style>body { margin: 0; } body > div { width:100px; height:50px; } iframe { width:100px; height:50px; border:0; }</style>
<body><div data-testid="open"></div><div data-testid="closed"></div><iframe title="未走査" src="about:blank"></iframe>
<script>document.querySelector('[data-testid=open]').attachShadow({mode:'open'}).innerHTML='<div style="width:50px;height:20px">開いたroot</div>'; document.querySelector('[data-testid=closed]').attachShadow({mode:'closed'}).innerHTML='<div>閉じたroot</div>';</script></body></html>
