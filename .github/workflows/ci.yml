name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Biome / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: 依存関係のインストール
        run: npm ci
        working-directory: plugins/elchika-tools/mcp-server

      - name: MCP サーバーのテスト
        run: npm test
        working-directory: plugins/elchika-tools/mcp-server

      # Biome は処理対象が0件なら既定で失敗する。出力の Checked N files で実件数を確認する。
      - name: Biome（処理件数を出力し、0件なら失敗）
        run: npx --yes @biomejs/biome@2.3.10 check .
